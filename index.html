<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Tap Bot Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .score { font-size: 42px; font-weight: bold; margin: 20px 0; color: #38bdf8; }
        #coin {
            width: 180px; height: 180px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border-radius: 50%;
            margin: 30px auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 50px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
            user-select: none;
            transition: transform 0.1s;
        }
        #coin:active { transform: scale(0.90); }
        .ad-container {
            margin-top: 40px;
            padding: 10px;
            background: #1e293b;
            border-radius: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h2>⚡ Tap & Earn Bot</h2>
    <div class="score" id="score">0</div>
    <div id="coin">🪙</div>

    <div class="ad-container" id="ad-block">
        <p>Reklama joyi (Banner)</p>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let score = localStorage.getItem('user_score') ? parseInt(localStorage.getItem('user_score')) : 0;
        document.getElementById("score").innerText = score;

        const coin = document.getElementById("coin");
        coin.addEventListener("click", () => {
            score += 1;
            document.getElementById("score").innerText = score;
            localStorage.setItem('user_score', score);
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred("light");
            }
        });
    </script>
</body>
</html>
