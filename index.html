<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Coin App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .btn { background: #38bdf8; color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .tap-btn { width: 150px; height: 150px; border-radius: 50%; background: #0284c7; font-size: 40px; display: flex; align-items: center; justify-content: center; margin: 20px auto; cursor: pointer; border: 4px solid #38bdf8; }
    </style>
</head>
<body>

<div class="card">
    <h3>Balans</h3>
    <h1 id="balance">0</h1>
</div>

<div class="tap-btn" onclick="tapCoin()">🪙</div>

<p id="status" style="font-size: 12px; color: #94a3b8;">Yuklanmoqda...</p>

<script>
    const firebaseConfig = {
        apiKey: "AZzaSyAnB4d...", 
        authDomain: "claudecoin.firebaseapp.com",
        projectId: "claudecoin",
        storageBucket: "claudecoin.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456:web:abcd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let tg = window.Telegram.WebApp;
    tg.expand();

    // Doimiy barqaror ID (Agar Telegram user bermasa, test ID ishlatiladi)
    let user = tg.initDataUnsafe?.user;
    let userId = user ? user.id.toString() : "6680296518"; 
    let balance = 0;

    const userRef = db.collection("users").doc(userId);

    // Bazadan ma'lumotni o'qib olish
    userRef.get().then((doc) => {
        if (doc.exists) {
            balance = doc.data().balance || 0;
        } else {
            userRef.set({ balance: 0 });
        }
        document.getElementById("balance").innerText = balance;
        document.getElementById("status").innerText = "Ma'lumot bazadan yuklandi ✅";
    }).catch((error) => {
        document.getElementById("status").innerText = "Xatolik: " + error.message;
    });

    // Tanga bosilganda darhol bazaga yozish
    function tapCoin() {
        balance += 1;
        document.getElementById("balance").innerText = balance;
        
        userRef.set({ balance: balance }, { merge: true }).then(() => {
            document.getElementById("status").innerText = "Saqlandi 💾";
        }).catch((error) => {
            document.getElementById("status").innerText = "Saqlashda xato: " + error.message;
        });
    }
</script>

</body>
</html>
