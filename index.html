
        <!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Coin Tap Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, #1b0f28 0%, #0d0714 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            padding: 15px 10px;
        }
        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
        .brand-title {
            font-size: 14px;
            letter-spacing: 2px;
            color: #d8b4fe;
            font-weight: 600;
            text-transform: uppercase;
        }
        .balance-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
        }
        .balance-icon {
            font-size: 28px;
        }
        .game-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }
        #coin {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #fde047 0%, #eab308 50%, #ca8a04 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(234, 179, 8, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.5);
            cursor: pointer;
            position: relative;
            transition: transform 0.05s ease;
            border: 4px solid #fef08a;
        }
        #coin:active {
            transform: scale(0.94);
        }
        .coin-inner-ring {
            width: 210px;
            height: 210px;
            border: 2px dashed rgba(133, 77, 14, 0.4);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .coin-text {
            font-size: 18px;
            font-weight: 800;
            color: #713f12;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .coin-symbol {
            font-size: 75px;
            font-weight: bold;
            color: #713f12;
            line-height: 1;
        }
        .floating-score {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: #fde047;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2); }
        }
        .footer-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-bottom: 10px;
        }
        .energy-container {
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: #e9d5ff;
        }
        .energy-bar-bg {
            width: 100%;
            height: 14px;
            background: #2e1065;
            border-radius: 10px;
            padding: 2px;
            border: 1px solid #581c87;
        }
        .energy-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f97316, #eab308);
            border-radius: 8px;
            transition: width 0.2s ease;
        }
        .nav-bar {
            width: 100%;
            background: rgba(30, 15, 50, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(147, 51, 234, 0.3);
            border-radius: 16px;
            display: flex;
            justify-content: space-around;
            padding: 10px 5px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 11px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item.active, .nav-item:hover {
            color: #facc15;
        }
        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-title">Claude Coin</div>
        <div class="balance-container">
            <span class="balance-icon">🪙</span>
            <span id="score">3,584,200</span>
        </div>
    </div>

    <div class="game-area">
        <div id="coin">
            <div class="coin-inner-ring">
                <span class="coin-text">CLAUDE</span>
                <span class="coin-symbol">C</span>
            </div>
        </div>
    </div>

    <div class="footer-section">
        <div class="energy-container">
            <div class="energy-info">
                <span>⚡ Energy</span>
                <span><span id="energy">1,842</span> / <span id="maxEnergy">2,000</span></span>
            </div>
            <div class="energy-bar-bg">
                <div class="energy-bar-fill" id="energyBar"></div>
            </div>
        </div>

        <div class="nav-bar">
            <button class="nav-item active">
                <span class="nav-icon">👆</span>
                <span>Tap</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">🔥</span>
                <span>Boost</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">👥</span>
                <span>Friends</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">💰</span>
                <span>Earn</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">🔨</span>
                <span>Auksion</span>
            </button>
        </div>
    </div>

    <script>
        let score = 3584200;
        let energy = 1842;
        let maxEnergy = 2000;
        let tapPower = 10; // Har bir bosishdagi tanga va energiya sarfi

        const scoreEl = document.getElementById('score');
        const energyEl = document.getElementById('energy');
        const maxEnergyEl = document.getElementById('maxEnergy');
        const energyBar = document.getElementById('energyBar');
        const coin = document.getElementById('coin');
        const gameArea = document.querySelector('.game-area');

        function updateUI() {
            scoreEl.innerText = score.toLocaleString();
            energyEl.innerText = energy.toLocaleString();
            maxEnergyEl.innerText = maxEnergy.toLocaleString();
            let percent = (energy / maxEnergy) * 100;
            energyBar.style.width = percent + '%';
        }

        coin.addEventListener('click', (e) => {
            if (energy >= tapPower) {
                score += tapPower;
                energy -= tapPower;
                updateUI();

                // Bosganda "+10" effekti
                createFloatingText(e, `+${tapPower}`);

                // Telefon tebranishi (Haptic)
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
                }
            }
        });

        function createFloatingText(e, text) {
            let rect = coin.getBoundingClientRect();
            let x = e.clientX || (rect.left + rect.width / 2);
            let y = e.clientY || (rect.top + rect.height / 2);

            let el = document.createElement('div');
            el.className = 'floating-score';
            el.innerText = text;
            
            // Tasodifiy qiyofada biroz o'ngga yoki chapga uchishi uchun
            let randomX = (Math.random() - 0.5) * 60;
            el.style.left = (x + randomX - 20) + 'px';
            el.style.top = (y - 40) + 'px';

            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // Energiyani har sekundda avtomatik tiklash
        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 15; // Sekundiga tiklanish tezligi
                if (energy > maxEnergy) energy = maxEnergy;
                updateUI();
            }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
