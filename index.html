    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --accent-color: #38bdf8;
            --gold-color: #fbbf24;
            --text-color: #f8fafc;
            --secondary-text: #94a3b8;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }
        body {
            margin: 0; padding: 0;
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1534088568595-a066f410bcda?q=80&w=1000&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: var(--text-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 80px;
        }
        .container { width: 100%; max-width: 480px; padding: 16px; box-sizing: border-box; text-align: center; }
        .hidden { display: none !important; }

        /* Top Header Balance */
        .top-balance-card {
            display: flex; justify-content: center; align-items: center; gap: 8px;
            background: var(--card-bg); padding: 10px 20px; border-radius: 30px;
            margin-bottom: 20px; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1); width: fit-content; margin-left: auto; margin-right: auto;
        }
        .top-balance-card span { font-size: 20px; font-weight: bold; color: var(--gold-color); }

        /* Balance & Tap */
        .balance-card {
            background: var(--card-bg); border-radius: 20px; padding: 20px;
            margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
        }
        .balance-title { font-size: 14px; color: var(--secondary-text); }
        .balance-amount { font-size: 40px; font-weight: bold; color: var(--gold-color); margin-top: 5px; text-shadow: 0 2px 10px rgba(251, 191, 36, 0.3); }

        .tap-circle {
            width: 190px; height: 190px; border-radius: 50%;
            background: radial-gradient(circle, #fbbf24 0%, #d97706 70%, #b45309 100%);
            margin: 25px auto; display: flex; align-items: center; justify-content: center;
            font-size: 60px; font-weight: bold; color: #fff; cursor: pointer;
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.4), inset 0 3px 6px rgba(255,255,255,0.5);
            user-select: none; transition: transform 0.08s ease, box-shadow 0.08s ease;
            border: 4px solid rgba(255, 255, 255, 0.3);
        }
        .tap-circle:active { 
            transform: scale(0.93); 
            box-shadow: 0 5px 15px rgba(251, 191, 36, 0.3), inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .energy-bar-container { background: var(--card-bg); border-radius: 10px; height: 14px; width: 100%; overflow: hidden; margin-top: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .energy-bar { background: linear-gradient(90deg, #38bdf8, #818cf8); height: 100%; width: 100%; transition: width 0.3s; }

        /* Sections */
        .section { display: none; width: 100%; }
        .section.active { display: block; }

        /* Auction Cards (Skrinshotdagi kabi) */
        .auction-card {
            background: var(--card-bg); border-radius: 16px; overflow: hidden;
            margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); text-align: left; cursor: pointer;
            transition: transform 0.2s;
        }
        .auction-card:hover { transform: translateY(-3px); }
        .auction-img-container { position: relative; width: 100%; height: 160px; }
        .auction-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .auction-badge {
            position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.6);
            padding: 4px 10px; border-radius: 20px; font-size: 12px; backdrop-filter: blur(5px);
            display: flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,0.2);
        }
        .auction-info { padding: 14px; display: flex; justify-content: space-between; align-items: center; }
        .auction-title { font-size: 16px; font-weight: bold; }
        .auction-price { color: var(--gold-color); font-weight: bold; font-size: 15px; }
        .auction-timer { font-size: 12px; color: var(--success-color); font-weight: bold; }

        /* Detailed Auction Modal / Screen */
        #auction-detail-view {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 2000; overflow-y: auto; padding: 20px; box-sizing: border-box;
            display: none; text-align: left;
        }
        .back-btn { background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
        
        .leader-item {
            background: rgba(30, 41, 59, 0.6); border-radius: 12px; padding: 12px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .leader-item.top-1 { background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(30, 41, 59, 0.8)); border: 1px solid var(--gold-color); }

        /* General Cards & Buttons */
        .card {
            background: var(--card-bg); border-radius: 14px; padding: 16px;
            margin-bottom: 12px; text-align: left; display: flex;
            justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
        }
